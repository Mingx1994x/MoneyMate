# CI-1：前後端的 lint、型別檢查、建置（後端另跑單元測試）；DEP-1：後端映像檔能 build 並啟動。
# CI-2：backend-e2e 從空資料庫跑 migration、prisma migrate diff、再跑 e2e。
# 分支保護只設 ci-ok 一個必要檢查。
name: CI

on:
  # 只跑目標是 dev、main 的 PR。禁止改成 pull_request_target。
  # edited：把 PR 的目標從功能分支改成 dev（手動或原分支被刪除後自動改）不在預設事件裡，
  # 不加的話 ci-ok 不會跑、PR 合併不了；代價是改 PR 標題或說明也會重跑一次。
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter 要讀 PR 的檔案清單

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/error-codes.md' # 跟錯誤代碼表的同步測試
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json' # 前端型別從這裡產生
              - '.github/workflows/**'
      # 該側的 lockfile 不存在就不跑（前端骨架合併前 frontend/ 只有 .gitkeep）。
      # hashFiles() 不能用在 job 層級的 if:，所以在這裡判斷。
      - id: result
        name: 判斷要跑哪一側
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          backend=false
          frontend=false
          if [ "$BACKEND_CHANGED" = true ] && [ -f backend/package-lock.json ]; then backend=true; fi
          if [ "$FRONTEND_CHANGED" = true ] && [ -f frontend/package-lock.json ]; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node --version
      # postinstall 會跑 prisma generate，不需要資料庫
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # 改了 API 卻沒重新匯出時失敗（前端型別從 openapi.json 產生）
      - name: 確認 openapi.json 是最新的
        run: |
          node dist/openapi/export.js
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=backend/openapi.json::openapi.json 不是最新的，請執行 npm run openapi:export 後 commit"
            exit 1
          fi
      - run: npm test

  # Render 在合併後才 build 映像檔；這裡先確認 Dockerfile 能 build、容器能啟動
  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t moneymate-api:ci backend
      - name: 映像檔內容
        run: |
          docker run --rm --entrypoint id moneymate-api:ci | grep -q 'uid=1000(node)'
          docker run --rm --entrypoint sh moneymate-api:ci -c 'test ! -e node_modules/vitest && test ! -e src && test -z "$(find /app -writable)"'
      # 只 build 抓不到「runtime 套件被放進 devDependencies」：要真的啟動才會 ERR_MODULE_NOT_FOUND。
      # 資料庫是假的（連不到的主機）；app 不在啟動時連線，/health 仍回 200。
      # DATABASE_SSL、TRUST_PROXY_HOPS 在 DEP-2 之後是 production 必填，先帶上，兩條 PR 誰先合併都不會壞。
      # JWT_SECRET 在 AUTH-1 之後必填；production 要 32 字元以上、不含 insecure，這個值只給這個容器用。
      - name: 啟動容器並確認 /health
        run: |
          docker run -d --name api -p 3001:3001 \
            -e DATABASE_URL=postgresql://ci:ci@db.invalid:5432/ci \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e DATABASE_SSL=false \
            -e TRUST_PROXY_HOPS=0 \
            -e JWT_SECRET=ci-docker-only-jwt-secret-0123456789abcdef \
            moneymate-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health || true)
            # INF-7 之後資料庫連不到時回 503，也算啟動成功
            if [ "$code" = 200 ] || [ "$code" = 503 ]; then
              echo "/health=$code"
              exit 0
            fi
            sleep 1
          done
          echo "::error::容器沒有在 30 秒內回應 /health"
          docker logs api
          exit 1

  # script 名稱與 A 約定；A 的 Nuxt 骨架合併前一定會被跳過
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # CI-2：空資料庫 migration、schema 與 migration 是否一致、e2e。
  # 與 backend、docker 並行；沒改後端時 skipped，ci-ok 仍可過。
  backend-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node --version
      - run: npm ci
      - name: 測試用環境檔
        run: cp .env.test.example .env.test
      - name: 從空資料庫跑完全部 migration
        run: npm run db:test:prepare
      - name: 建立 shadow 資料庫
        run: npm run db:create-shadow
      - name: schema 與 migration 是否一致
        run: npm run db:drift
      - name: e2e
        run: npm run test:e2e

  # 分支保護唯一的必要檢查。changes 失敗時其他 job 都是 skipped，
  # 所以 changes 必須是 success，其他只接受 success 或 skipped。
  ci-ok:
    needs: [changes, backend, docker, frontend, backend-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 彙總結果
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          DOCKER: ${{ needs.docker.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND_E2E: ${{ needs['backend-e2e'].result }}
        run: |
          echo "changes=$CHANGES backend=$BACKEND docker=$DOCKER frontend=$FRONTEND backend-e2e=$BACKEND_E2E"
          if [ "$CHANGES" != success ]; then
            echo "::error::changes job 不是 success（$CHANGES）"
            exit 1
          fi
          for result in "$BACKEND" "$DOCKER" "$FRONTEND" "$BACKEND_E2E"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::有 job 沒有通過（$result）"
                exit 1
                ;;
            esac
          done
